
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/compilar-apk-pruebas.yml'

permissions:
  contents: read

jobs:
  apk-pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TROPICALISIMA-ESTEREO-V1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
