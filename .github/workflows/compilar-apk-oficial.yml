
name: Compilar APK oficial firmada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK de produccion
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Firmar APK oficial
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan secretos de firma."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tropicalisima-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          mkdir -p dist

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/tropicalisima-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias tropicalisima \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out dist/TROPICALISIMA-ESTEREO-OFICIAL.apk \
            dist/tropicalisima-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            dist/TROPICALISIMA-ESTEREO-OFICIAL.apk

          rm dist/tropicalisima-aligned.apk

      - name: Guardar APK oficial
        uses: actions/upload-artifact@v4
        with:
          name: TROPICALISIMA-ESTEREO-APK-OFICIAL
          path: dist/TROPICALISIMA-ESTEREO-OFICIAL.apk
          if-no-files-found: error
